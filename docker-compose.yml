services:
  meting-api-audio-loudness:
    build: .
    container_name: meting-api-audio-loudness
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      PORT: "3100"
      MAX_DOWNLOAD_BYTES: "67108864"
      REQUEST_TIMEOUT_MS: "30000"
      UPSTREAM_API_TOKEN: "${UPSTREAM_API_TOKEN:-}"
    mem_limit: 256m
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: meting-api-audio-loudness-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - loudness-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  loudness-redis:
